<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Markdown Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js CDN for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Syntax Highlighting in Code Blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.6);
        }

        /* Typography Styles for Live Preview (Markdown Rendered Content) */
        .markdown-body {
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            color: inherit;
        }
        .markdown-body h1 {
            font-size: 2.1em;
            font-weight: 700;
            padding-bottom: 0.3em;
            border-bottom: 1px solid rgba(156, 163, 175, 0.25);
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            letter-spacing: -0.025em;
        }
        .markdown-body h2 {
            font-size: 1.6em;
            font-weight: 600;
            padding-bottom: 0.2em;
            border-bottom: 1px solid rgba(156, 163, 175, 0.15);
            margin-top: 1.2em;
            margin-bottom: 0.5em;
            letter-spacing: -0.02em;
        }
        .markdown-body h3 {
            font-size: 1.3em;
            font-weight: 600;
            margin-top: 1em;
            margin-bottom: 0.4em;
        }
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            font-weight: 600;
            margin-top: 0.8em;
            margin-bottom: 0.4em;
        }
        .markdown-body p {
            margin-bottom: 1em;
        }
        .markdown-body a {
            color: #0284c7;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.15s;
        }
        .markdown-body a:hover {
            color: #0369a1;
        }
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 1em;
        }
        .markdown-body ol {
            list-style-type: decimal;
            padding-left: 1.5em;
            margin-bottom: 1em;
        }
        .markdown-body li {
            margin-bottom: 0.3em;
        }
        .markdown-body blockquote {
            border-left: 4px solid #0284c7;
            padding-left: 1em;
            margin: 1em 0;
            font-style: italic;
            opacity: 0.9;
        }
        .markdown-body code:not(pre code) {
            font-family: 'Fira Code', monospace;
            background: rgba(156, 163, 175, 0.15);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.88em;
        }
        .markdown-body pre {
            background: #0d1117;
            border-radius: 8px;
            padding: 1em;
            overflow-x: auto;
            margin: 1.2em 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .light .markdown-body pre {
            background: #f6f8fa;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .markdown-body pre code {
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
            line-height: 1.5;
            background: transparent;
            padding: 0;
        }
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid rgba(156, 163, 175, 0.3);
            padding: 0.6em 1em;
            text-align: left;
        }
        .markdown-body th {
            font-weight: 600;
            background: rgba(156, 163, 175, 0.1);
        }
        .markdown-body hr {
            height: 1px;
            border: none;
            background-color: rgba(156, 163, 175, 0.3);
            margin: 1.5em 0;
        }
        .markdown-body input[type="checkbox"] {
            margin-right: 0.5em;
            accent-color: #0284c7;
        }
        
        /* Line Counter Alignment */
        #line-numbers {
            font-family: 'Fira Code', monospace;
            user-select: none;
            text-align: right;
            padding-right: 0.75rem;
            opacity: 0.4;
        }
    </style>
</head>

        const viewPreview = document.getElementById('view-preview');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // Configure Marked library settings
        marked.setOptions({
            gfm: true,
            breaks: true,
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        // App Initialization
        window.onload = () => {
            // Load saved content or sample content
            const savedContent = localStorage.getItem('md_studio_content');
            const savedTitle = localStorage.getItem('md_studio_title');
            const savedTheme = localStorage.getItem('md_studio_theme');

            if (savedContent !== null) {
                markdownInput.value = savedContent;
            } else {
                markdownInput.value = SAMPLE_MARKDOWN;
            }

            if (savedTitle) {
                docTitle.value = savedTitle;
            }

            // Theme Init
            if (savedTheme === 'light') {
                enableLightTheme();
            } else {
                enableDarkTheme();
            }

            updateRender();
            syncScroll();
        };

        // Render Markdown & Metadata Update
        function updateRender() {
            const content = markdownInput.value;
            
            // Render HTML
            markdownPreview.innerHTML = marked.parse(content);
            
            // Re-apply syntax highlighting for code blocks
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });

            // Update Line Numbers
            updateLineNumbers(content);

            // Update Statistics
            updateStats(content);

            // Trigger Auto-save
            triggerAutoSave(content);
        }

        // Line Numbers Calculation
        function updateLineNumbers(text) {
            const lines = text.split('\n').length;
            let linesArr = [];
            for (let i = 1; i <= lines; i++) {
                linesArr.push(i);
            }
            lineNumbers.innerHTML = linesArr.join('<br>');
        }

        // Statistics (Words, Chars, Read Time)
        function updateStats(text) {
            const cleanText = text.trim();
            const words = cleanText ? cleanText.split(/\s+/).length : 0;
            const chars = text.length;
            const readTime = Math.ceil(words / 200); // Avg 200 words per minute

            wordCountEl.textContent = words.toLocaleString();
            charCountEl.textContent = chars.toLocaleString();
            readTimeEl.textContent = `${readTime} min`;
        }

        // Auto Save to LocalStorage with Debounce
        let saveTimeout;
        function triggerAutoSave(content) {
            clearTimeout(saveTimeout);
            autosaveStatus.classList.add('opacity-50');
            
            saveTimeout = setTimeout(() => {
                localStorage.setItem('md_studio_content', content);
                localStorage.setItem('md_studio_title', docTitle.value);
                autosaveStatus.classList.remove('opacity-50');
            }, 600);
        }

        // Toast Notification Trigger
        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Event Listeners for Live Preview & Syncing
        markdownInput.addEventListener('input', updateRender);
        docTitle.addEventListener('input', () => {
            localStorage.setItem('md_studio_title', docTitle.value);
        });

        // Synchronize Scroll between Textarea and Line Numbers
        markdownInput.addEventListener('scroll', () => {
            lineNumbers.scrollTop = markdownInput.scrollTop;
        });

        // Theme Toggle Handler
        function enableLightTheme() {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.body.classList.remove('bg-slate-900', 'text-slate-100');
            document.body.classList.add('bg-slate-50', 'text-slate-800');
            iconMoon.classList.add('hidden');
            iconSun.classList.remove('hidden');
            document.getElementById('hljs-theme').href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
            localStorage.setItem('md_studio_theme', 'light');
        }

        function enableDarkTheme() {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.body.classList.remove('bg-slate-50', 'text-slate-800');
            document.body.classList.add('bg-slate-900', 'text-slate-100');
            iconSun.classList.add('hidden');
            iconMoon.classList.remove('hidden');
            document.getElementById('hljs-theme').href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css';
            localStorage.setItem('md_studio_theme', 'dark');
        }

        btnTheme.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                enableLightTheme();
            } else {
                enableDarkTheme();
            }
        });

        // Focus Mode Handler
        let isFocusMode = false;
        btnFocus.addEventListener('click', () => {
            isFocusMode = !isFocusMode;
            const header = document.getElementById('main-header');
            const toolbar = document.getElementById('formatting-toolbar');

            if (isFocusMode) {
                header.classList.add('-mt-14');
                toolbar.classList.add('hidden');
                showToast('Mode Fokus Aktif (Klik icon fullscreen lagi untuk keluar)');
            } else {
                header.classList.remove('-mt-14');
                toolbar.classList.remove('hidden');
            }
        });

        // View Mode Switcher (Split, Editor Only, Preview Only)
        function setViewMode(mode) {
            viewSplit.className = "px-2 py-0.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-200 transition";
            viewEditor.className = "px-2 py-0.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-200 transition";
            viewPreview.className = "px-2 py-0.5 rounded text-[11px] font-medium text-slate-400 hover:text-slate-200 transition";

            if (mode === 'split') {
                panelEditor.classList.remove('hidden', 'w-full');
                panelEditor.classList.add('w-1/2');
                panelPreview.classList.remove('hidden', 'w-full');
                panelPreview.classList.add('w-1/2');
                viewSplit.className = "px-2 py-0.5 rounded text-[11px] font-medium bg-brand-600 text-white transition";
            } else if (mode === 'editor') {
                panelEditor.classList.remove('hidden', 'w-1/2');
                panelEditor.classList.add('w-full');
                panelPreview.classList.add('hidden');
                viewEditor.className = "px-2 py-0.5 rounded text-[11px] font-medium bg-brand-600 text-white transition";
            } else if (mode === 'preview') {
                panelEditor.classList.add('hidden');
                panelPreview.classList.remove('hidden', 'w-1/2');
                panelPreview.classList.add('w-full');
                viewPreview.className = "px-2 py-0.5 rounded text-[11px] font-medium bg-brand-600 text-white transition";
            }
        }

        viewSplit.addEventListener('click', () => setViewMode('split'));
        viewEditor.addEventListener('click', () => setViewMode('editor'));
        viewPreview.addEventListener('click', () => setViewMode('preview'));

        // Formatting Toolbar Actions Handler
        const toolbarButtons = document.querySelectorAll('[data-format]');
        toolbarButtons.forEach(button => {
            button.addEventListener('click', () => {
                const format = button.getAttribute('data-format');
                insertFormat(format);
            });
        });

        function insertFormat(format) {
            const start = markdownInput.selectionStart;
            const end = markdownInput.selectionEnd;
            const text = markdownInput.value;
            const selectedText = text.substring(start, end);

            let replacement = '';
            let cursorOffset = 0;

            switch (format) {
                case 'bold':
                    replacement = `**${selectedText || 'teks tebal'}**`;
                    cursorOffset = 2;
                    break;
                case 'italic':
                    replacement = `*${selectedText || 'teks miring'}*`;
                    cursorOffset = 1;
                    break;
                case 'strikethrough':
                    replacement = `~~${selectedText || 'teks coret'}~~`;
                    cursorOffset = 2;
                    break;
                case 'h1':
                    replacement = `# ${selectedText || 'Judul 1'}`;
                    cursorOffset = 2;
                    break;
                case 'h2':
                    replacement = `## ${selectedText || 'Judul 2'}`;
                    cursorOffset = 3;
                    break;
                case 'h3':
                    replacement = `### ${selectedText || 'Judul 3'}`;
                    cursorOffset = 4;
                    break;
                case 'ul':
                    replacement = `- ${selectedText || 'Item daftar'}`;
                    cursorOffset = 2;
                    break;
                case 'ol':
                    replacement = `1. ${selectedText || 'Item daftar'}`;
                    cursorOffset = 3;
                    break;
                case 'task':
                    replacement = `- [ ] ${selectedText || 'Tugas baru'}`;
                    cursorOffset = 6;
                    break;
                case 'quote':
                    replacement = `> ${selectedText || 'Kutipan teks'}`;
                    cursorOffset = 2;
                    break;
                case 'code':
                    replacement = `\`\`\`javascript\n${selectedText || '// Tulis kode di sini'}\n\`\`\``;
                    cursorOffset = 3;
                    break;
                case 'link':
                    replacement = `[${selectedText || 'Teks Tautan'}](https://example.com)`;
                    cursorOffset = 1;
                    break;
                case 'table':
                    replacement = `\n| Kolom 1 | Kolom 2 |\n| --- | --- |\n| Data 1 | Data 2 |\n`;
                    cursorOffset = 2;
                    break;
                case 'hr':
                    replacement = `\n---\n`;
                    cursorOffset = 5;
                    break;
            }

            markdownInput.value = text.substring(0, start) + replacement + text.substring(end);
            markdownInput.focus();
            markdownInput.setSelectionRange(start + cursorOffset, start + cursorOffset + (selectedText.length || 0));
            updateRender();
        }

        // Keyboard Shortcuts Support (Ctrl+B, Ctrl+I)
        markdownInput.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'b' || e.key === 'B') {
                    e.preventDefault();
                    insertFormat('bold');
                } else if (e.key === 'i' || e.key === 'I') {
                    e.preventDefault();
                    insertFormat('italic');
                }
            }
        });

        // Copy Raw Markdown
        document.getElementById('btn-copy-md').addEventListener('click', () => {
            const tempArea = document.createElement('textarea');
            tempArea.value = markdownInput.value;
            document.body.appendChild(tempArea);
            tempArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempArea);
            showToast('Kode Markdown berhasil disalin!');
        });

        // Copy Formatted HTML
        document.getElementById('btn-copy-html').addEventListener('click', () => {
            const tempArea = document.createElement('textarea');
            tempArea.value = markdownPreview.innerHTML;
            document.body.appendChild(tempArea);
            tempArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempArea);
            showToast('Hasil HTML berhasil disalin!');
        });

        // Export as .md File
        document.getElementById('btn-export-md').addEventListener('click', () => {
            const blob = new Blob([markdownInput.value], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement('a');
            const filename = docTitle.value.endsWith('.md') ? docTitle.value : `${docTitle.value}.md`;
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            showToast(`File ${filename} berhasil diunduh!`);
        });

        // Export as Styled Standalone HTML File
        document.getElementById('btn-export-html').addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');
            const fullHtmlContent = `<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${docTitle.value.replace('.md', '')}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/${isDark ? 'github-dark' : 'github'}.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            background-color: ${isDark ? '#0f172a' : '#ffffff'};
            color: ${isDark ? '#f8fafc' : '#1e293b'};
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        h1, h2, h3, h4 { color: inherit; font-weight: 700; }
        h1 { border-bottom: 1px solid rgba(156,163,175,0.3); padding-bottom: 0.3em; }
        h2 { border-bottom: 1px solid rgba(156,163,175,0.2); padding-bottom: 0.2em; }
        code { font-family: 'Fira Code', monospace; background: rgba(156,163,175,0.15); padding: 0.2em 0.4em; border-radius: 4px; }
        pre code { background: transparent; padding: 0; }
        pre { background: ${isDark ? '#0d1117' : '#f6f8fa'}; padding: 1em; border-radius: 8px; overflow-x: auto; }
        blockquote { border-left: 4px solid #0284c7; padding-left: 1em; margin: 1em 0; font-style: italic; opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin: 1em 0; }
        th, td { border: 1px solid rgba(156,163,175,0.3); padding: 0.6em 1em; }
        th { background: rgba(156,163,175,0.1); }
        a { color: #0284c7; }
    </style>
</head>
<body>
    ${markdownPreview.innerHTML}
</body>
</html>`;

            const blob = new Blob([fullHtmlContent], { type: 'text/html;charset=utf-8;' });
            const link = document.createElement('a');
            const filename = `${docTitle.value.replace('.md', '')}.html`;
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            showToast(`File ${filename} berhasil diunduh!`);
        });
    </script>
</body>
</html>
